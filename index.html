    <!-- Consent-aware Google tag. Keep this allowlist in sync with
         src/utils/analyticsHost.ts. Script load, consent, config, and later
         events all stay off localhost and preview hosts. -->
    <script>
      var actualAnalyticsHostname = String(window.location.hostname || '').toLowerCase().replace(/\.$/, '');
      var analyticsTestHost = window.__EXQUISITE_ANALYTICS_TEST_HOST__;
      var analyticsHostname = actualAnalyticsHostname;
      if (
        typeof analyticsTestHost === 'string' &&
        analyticsTestHost &&
        actualAnalyticsHostname !== 'exquisitedentistryla.com' &&
        actualAnalyticsHostname !== 'www.exquisitedentistryla.com'
      ) {
        analyticsHostname = String(analyticsTestHost).toLowerCase().replace(/\.$/, '');
      }

      var canonicalAnalyticsHost =
        analyticsHostname === 'exquisitedentistryla.com' ||
        analyticsHostname === 'www.exquisitedentistryla.com';

      if (canonicalAnalyticsHost) {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = window.gtag || gtag;

        var analyticsConsent = null;
        try {
          analyticsConsent = window.localStorage.getItem('exquisite_analytics_consent_v1');
        } catch (error) {
          analyticsConsent = null;
        }

        gtag('consent', 'default', {
          analytics_storage: analyticsConsent === 'granted' ? 'granted' : 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          wait_for_update: 500
        });
        gtag('set', 'ads_data_redaction', true);
        gtag('set', 'url_passthrough', true);
        gtag('js', new Date());

        var initialPath = window.location.pathname || '/';
        try {
          var decodedInitialPath = decodeURIComponent(initialPath);
          if (
            /[^\s@]+@[^\s@]+\.[^\s@]+/.test(decodedInitialPath) ||
            /(?:\+?\d[\s().-]*){7,}/.test(decodedInitialPath)
          ) {
            initialPath = '/redacted';
          }
        } catch (error) {
          initialPath = '/redacted';
        }

        var initialTagLocation = window.location.origin + initialPath;
        try {
          var sourceUrl = new URL(window.location.href);
          var tagUrl = new URL(initialTagLocation);
          [
            'utm_id', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term',
            'gclid', 'gbraid', 'wbraid', 'dclid', 'msclkid', 'fbclid'
          ].forEach(function(parameter) {
            var value = sourceUrl.searchParams.get(parameter);
            if (
              value &&
              value.length <= 120 &&
              value.indexOf('@') === -1 &&
              !/(?:\+?\d[\s().-]*){7,}/.test(value)
            ) {
              tagUrl.searchParams.set(parameter, value);
            }
          });
          initialTagLocation = tagUrl.toString();
        } catch (error) {
          initialTagLocation = window.location.origin + initialPath;
        }

        var privacySafeConfig = {
          send_page_view: false,
          allow_google_signals: false,
          allow_ad_personalization_signals: false,
          page_location: initialTagLocation
        };

        gtag('config', 'G-1MZGF2XNB5', privacySafeConfig);
        // Configure Ads at landing time so campaign click context is not deferred.
        // No direct Ads conversion is emitted; the real GA lead is imported once.
        gtag('config', 'AW-11373090310', privacySafeConfig);

        var googleTag = document.createElement('script');
        googleTag.async = true;
        googleTag.src = 'https://www.googletagmanager.com/gtag/js?id=G-1MZGF2XNB5';
        googleTag.setAttribute('data-name', 'google-tag');
        document.head.appendChild(googleTag);
      }
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        background-color: #000000;
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      body {
        font-family: 'Open Sans', system-ui, sans-serif;
        background-color: #f9fafb;
        color: #1a1a1a;
        overflow-x: hidden;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        /* Ensure no colored background shows on iPhone */
        position: relative;
      }
      /* iPhone safe area support */
      @supports (padding: max(0px)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      .video-hero-container {
        height: 60vh;
        background-color: #1a1a1a;
        contain: layout;
      }
      @media (min-width: 768px) { .video-hero-container { height: 80vh; } }
      @media (min-width: 1024px) { .video-hero-container { height: 100vh; } }
      .skeleton {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      .no-js { visibility: hidden; opacity: 0; }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        background-color: #D4AF37;
        color: white;
        border-radius: 0.25rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s;
      }
      .btn-primary:hover { background-color: #B8941F; transform: translateY(-1px); }
      .text-gold { color: #D4AF37; }
      .bg-gold { background-color: #D4AF37; }
      img { max-width: 100%; height: auto; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 600; line-height: 1.2; }
      h1 { font-size: 2.5rem; } h2 { font-size: 2rem; } h3 { font-size: 1.5rem; }
      @media (min-width: 768px) { h1 { font-size: 3.5rem; } h2 { font-size: 2.5rem; } h3 { font-size: 1.875rem; } }
      .container { width: 100%; margin: 0 auto; padding: 0 16px; }
      @media (min-width: 640px) { .container { max-width: 640px; } }
      @media (min-width: 768px) { .container { max-width: 768px; } }
      @media (min-width: 1024px) { .container { max-width: 1024px; } }
      @media (min-width: 1280px) { .container { max-width: 1280px; } }
      .visually-hidden {
        position: absolute !important;
        clip: rect(1px, 1px, 1px, 1px) !important;
        padding: 0 !important;
        border: 0 !important;
        height: 1px !important;
        width: 1px !important;
        overflow: hidden !important;
      }
    </style>
